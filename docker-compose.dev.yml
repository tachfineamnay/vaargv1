# VAARG V1 — local development infrastructure.
# PostgreSQL 18 + pgvector, Valkey. Private internal network; no host socket,
# no privileged containers. Ports are exposed only for local development.
name: vaarg-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaarg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaarg_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-vaarg}
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 mounts data at /var/lib/postgresql (PGDATA /var/lib/postgresql/18/docker).
      - vaarg_pg_dev:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    shm_size: '256mb'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vaarg} -d ${POSTGRES_DB:-vaarg}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - vaarg-internal

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vaarg-internal

  # Optional confined Hermes runtime (NousResearch/hermes-agent v0.23.4).
  # Activate explicitly with: docker compose -f docker-compose.dev.yml --profile hermes up
  # Never publishes ports to browsers unless bound to 127.0.0.1 for local server integration tests.
  hermes:
    profiles: ['hermes']
    build:
      context: .
      dockerfile: deploy/hermes/Dockerfile
    restart: unless-stopped
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    environment:
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      VAARG_INTERNAL_API_URL: ${VAARG_INTERNAL_API_URL:-http://host.docker.internal:4111}
      HERMES_TOOL_BRIDGE_SECRET: ${HERMES_TOOL_BRIDGE_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    expose:
      - '8642'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8642/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - vaarg-internal

networks:
  vaarg-internal:
    driver: bridge

volumes:
  vaarg_pg_dev:
