version: '3.8'

services:
  # PostgreSQL 18 with pgvector
  postgres:
    image: pgvector/pgvector:pg18
    container_name: vaargv1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaargv1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaargv1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Valkey 8 (Redis-compatible)
  valkey:
    image: valkey/valkey:8-alpine
    container_name: vaargv1-valkey
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  # API (NestJS + Fastify)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: vaargv1-api
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vaargv1
      VALKEY_URL: redis://valkey:6379
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/contracts:/app/packages/contracts
      - api_node_modules:/app/apps/api/node_modules
    command: pnpm run dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Web (Next.js 16)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: vaargv1-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/contracts:/app/packages/contracts
      - web_node_modules:/app/apps/web/node_modules
    command: pnpm run dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Worker (BullMQ)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: vaargv1-worker
    environment:
      NODE_ENV: development
      VALKEY_URL: redis://valkey:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vaargv1
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages/contracts:/app/packages/contracts
      - worker_node_modules:/app/apps/worker/node_modules
    command: pnpm run dev
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:
  valkey_data:
  api_node_modules:
  web_node_modules:
  worker_node_modules:
