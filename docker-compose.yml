name: vaarg-p00

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaarg
      POSTGRES_PASSWORD: vaarg_local_password
      POSTGRES_DB: vaarg
    ports:
      - '5432:5432'
    volumes:
      - vaarg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaarg -d vaarg']
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgvector
      - -c
      - max_connections=200

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vaarg-postgres-data:
